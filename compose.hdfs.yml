name: storagehive-hdfs

services:
  namenode:
    image: apache/hadoop:3.4.2-lean
    hostname: namenode
    user: "0:0"
    environment:
      HADOOP_CONF_DIR: /etc/storagehive-hdfs
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        if [ ! -f /data/namenode/current/VERSION ]; then
          /opt/hadoop/bin/hdfs namenode -format -nonInteractive
        fi
        exec /opt/hadoop/bin/hdfs namenode
    ports:
      - "127.0.0.1:9870:9870"
    volumes:
      - ./hdfs/conf:/etc/storagehive-hdfs:ro
      - namenode-data:/data/namenode
    healthcheck:
      test: ["CMD-SHELL", "/opt/hadoop/bin/hdfs dfsadmin -safemode get | grep -q 'Safe mode is OFF'"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
  datanode1:
    image: apache/hadoop:3.4.2-lean
    hostname: datanode1
    user: "0:0"
    environment:
      HADOOP_CONF_DIR: /etc/storagehive-hdfs
    entrypoint: ["/opt/hadoop/bin/hdfs", "datanode"]
    volumes:
      - ./hdfs/conf:/etc/storagehive-hdfs:ro
      - datanode1-data:/data/datanode

  datanode2:
    image: apache/hadoop:3.4.2-lean
    hostname: datanode2
    user: "0:0"
    environment:
      HADOOP_CONF_DIR: /etc/storagehive-hdfs
    entrypoint: ["/opt/hadoop/bin/hdfs", "datanode"]
    volumes:
      - ./hdfs/conf:/etc/storagehive-hdfs:ro
      - datanode2-data:/data/datanode

  datanode3:
    image: apache/hadoop:3.4.2-lean
    hostname: datanode3
    user: "0:0"
    environment:
      HADOOP_CONF_DIR: /etc/storagehive-hdfs
    entrypoint: ["/opt/hadoop/bin/hdfs", "datanode"]
    volumes:
      - ./hdfs/conf:/etc/storagehive-hdfs:ro
      - datanode3-data:/data/datanode
  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/cluster').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 6s
      retries: 12
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      NAMENODE_URL: http://namenode:9870
      PGHOST: db
      PGDATABASE: storagehive
      PGUSER: storagehive
      PGPASSWORD: ${STORAGEHIVE_DB_PASSWORD:-storagehive_local_dev}
   
    ports:
      - "127.0.0.1:3001:3001"
  web:
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"  

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storagehive
      POSTGRES_USER: storagehive
      POSTGRES_PASSWORD: ${STORAGEHIVE_DB_PASSWORD:-storagehive_local_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/001-users.sql:/docker-entrypoint-initdb.d/001-users.sql:ro
      - ./db/002-sessions.sql:/docker-entrypoint-initdb.d/002-sessions.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "storagehive", "-d", "storagehive"]
      interval: 5s
      timeout: 5s
      retries: 12    
volumes:
  namenode-data:
  datanode1-data:
  datanode2-data:
  datanode3-data:
  web-node-modules:
  postgres-data:
